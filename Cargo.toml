[package]
name = "kanae"
version = "0.1.0"
edition = "2021"

[package.metadata.bundle]
name = "Kanae"
identifier = "com.kanae.player"
category = "public.app-category.music"
short_description = "CD and file music player"
long_description = "Kanae is a Qt/QML + Rust music player supporting CDs and local files."

[features]
# build variants: gui (qt/qml), tui (ratatui) or hybrid (both, the default). for gui-only,
# use --no-default-features --features gui; for tui-only, use --no-default-features --features tui
default = ["gui", "tui"]
gui = ["dep:cxx", "dep:cxx-qt", "dep:cxx-qt-lib", "dep:rfd", "dep:blurhash"]
tui = ["dep:ratatui", "dep:crossterm", "dep:unicode-width", "dep:ratatui-image"]

[dependencies]
# shared
cd-da-reader = "0.4.1"
# output-only: kanae decodes with symphonia itself, so rodio's decoder features
# (which would pull a second, older symphonia tree) are disabled.
rodio = { version = "0.22", default-features = false, features = ["playback", "dither"] }
sha1 = "0.10"
base64 = "0.22"
ureq = { version = "3", features = ["json"] }
discordipc = "0.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.22"
rayon = "1"
# "all" = every codec/container/metadata reader (0.6 adds ape decode);
# opt-simd enables sse/avx/neon dsp.
symphonia = { version = "0.6", features = ["all", "opt-simd"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# gui-only
cxx          = { version = "1.0",  optional = true }
cxx-qt       = { version = "0.8",  optional = true }
cxx-qt-lib   = { version = "0.8",  features = ["qt_full"], optional = true }
rfd          = { version = "0.15", optional = true }
blurhash     = { version = "0.2",  optional = true }
souvlaki     = "0.8.3"

# tui-only
ratatui      = { version = "0.30", optional = true }
crossterm    = { version = "0.29", features = ["event-stream"], optional = true }
unicode-width = { version = "0.2", optional = true }
ratatui-image = { version = "10",  default-features = false, features = ["crossterm", "image-defaults"], optional = true }
kakasi = "0.1.0"
serde_yaml_ng = "0.10.0"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "processthreadsapi", "fileapi", "winioctl", "ioapiset", "handleapi", "wincon", "consoleapi", "processenv", "winbase", "winnt", "dwmapi"] }
winreg = "0.52"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[profile.release]
# debug info is left out and symbols stripped: on elf/mach-o it is embedded in
# the binary rather than split into a side file like a windows .pdb, which made
# the linux/macos builds several times larger than they needed to be
debug = false
strip = "symbols"
lto = false

[build-dependencies]
# always present; only invoked when the 'gui' feature is active (see build.rs).
cxx-qt-build = { version = "0.8", features = ["link_qt_object_files"] }
