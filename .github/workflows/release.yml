name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
  QT_VERSION: '6.8.*'
  QT_MODULES: 'qtshadertools'

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: hybrid
            cargo_flags: ""
            needs_qt: true
          - variant: gui
            cargo_flags: "--no-default-features --features gui"
            needs_qt: true
          - variant: tui
            cargo_flags: "--no-default-features --features tui"
            needs_qt: false

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.variant }}

      - uses: jurplel/install-qt-action@v4
        if: matrix.needs_qt
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Set QMAKE
        if: matrix.needs_qt
        shell: pwsh
        run: |
          $q = (where.exe qmake 2>$null | Select-Object -First 1).Trim()
          "QMAKE=$q" >> $env:GITHUB_ENV
          "QT_PLUGIN_PATH=$(Split-Path $q -Parent)\..\..\plugins" >> $env:GITHUB_ENV
          "QML_IMPORT_PATH=$(Split-Path $q -Parent)\..\..\qml" >> $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        run: cargo build --release ${{ matrix.cargo_flags }}

      - name: Install NSIS
        if: matrix.needs_qt
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      # gui & hybrid
      - name: Package installer (gui/hybrid)
        if: matrix.needs_qt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\kanae.exe dist\
          windeployqt6 `
            --release `
            --no-translations `
            --no-system-d3d-compiler `
            --no-compiler-runtime `
            --qmldir qml `
            dist\kanae.exe
          # VERSION is a tag name ("v1.2.3") or "dev"; the exe's file properties
          # need a four-part number
          $num = "0.0.0.0"
          if ($env:VERSION -match '^v?(\d+(?:\.\d+){0,3})$') {
            $parts = $Matches[1].Split('.')
            $num = (($parts + @('0') * 4)[0..3]) -join '.'
          }
          makensis /DVERSION=$env:VERSION /DVERSION_NUM=$num `
            /DVARIANT=${{ matrix.variant }} scripts\installer.nsi

      # tui only
      - name: Package executable (tui)
        if: matrix.variant == 'tui'
        shell: pwsh
        run: Copy-Item target\release\kanae.exe "kanae-tui-windows-x64-$env:VERSION.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: kanae-windows-${{ matrix.variant }}
          if-no-files-found: error
          path: |
            kanae-${{ matrix.variant }}-windows-x64-${{ env.VERSION }}.exe


  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: hybrid
            cargo_flags: ""
            needs_qt: true
          - variant: gui
            cargo_flags: "--no-default-features --features gui"
            needs_qt: true
          - variant: tui
            cargo_flags: "--no-default-features --features tui"
            needs_qt: false

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.variant }}

      - uses: jurplel/install-qt-action@v4
        if: matrix.needs_qt
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Set QMAKE
        if: matrix.needs_qt
        run: echo "QMAKE=$(which qmake)" >> "$GITHUB_ENV"

      # agl.framework was removed from the macos sdk in xcode 26, but qt's prl
      # metadata still lists it, and qt-build-utils forwards it to the linker
      - name: Strip AGL from Qt link metadata
        if: matrix.needs_qt
        run: |
          QT_LIBS="$(qmake -query QT_INSTALL_LIBS)"
          find "$QT_LIBS" -name '*.prl' -print0 \
            | xargs -0 sed -i '' -e 's/-framework AGL//g'

      - name: Build
        run: cargo build --release ${{ matrix.cargo_flags }}


      # gui & hybrid
      - name: Package .app (gui/hybrid)
        if: matrix.needs_qt
        run: |
          ARCH=$(uname -m)
          SHORT_VERSION=${VERSION#v}
          APP=dist/Kanae.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/kanae "$APP/Contents/MacOS/kanae"
          chmod +x "$APP/Contents/MacOS/kanae"
          printf 'APPL????' > "$APP/Contents/PkgInfo"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>kanae</string>
            <key>CFBundleIdentifier</key><string>com.chair.kanae</string>
            <key>CFBundleName</key><string>Kanae</string>
            <key>CFBundleDisplayName</key><string>Kanae</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>${SHORT_VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${SHORT_VERSION}</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
          </dict>
          </plist>
          PLIST

          plutil -lint "$APP/Contents/Info.plist"

          macdeployqt "$APP" -qmldir=qml

          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" "kanae-${{ matrix.variant }}-macos-${ARCH}-${VERSION}.zip"

      # tui only
      - name: Package executable (tui)
        if: matrix.variant == 'tui'
        run: |
          ARCH=$(uname -m)
          cp target/release/kanae "kanae-tui-macos-${ARCH}-${VERSION}"
          codesign --force --sign - "kanae-tui-macos-${ARCH}-${VERSION}"

      - uses: actions/upload-artifact@v4
        with:
          name: kanae-macos-${{ matrix.variant }}
          if-no-files-found: error
          path: |
            kanae-${{ matrix.variant }}-macos-*-${{ env.VERSION }}.zip
            kanae-tui-macos-*-${{ env.VERSION }}

  # linux
  linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: hybrid
            cargo_flags: ""
            needs_qt: true
          - variant: gui
            cargo_flags: "--no-default-features --features gui"
            needs_qt: true
          - variant: tui
            cargo_flags: "--no-default-features --features tui"
            needs_qt: false

    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies (common)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config

      - name: Install system dependencies (gui/hybrid)
        if: matrix.needs_qt
        run: |
          sudo apt-get install -y \
            libglib2.0-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libfuse2 \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.variant }}

      - uses: jurplel/install-qt-action@v4
        if: matrix.needs_qt
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Set QMAKE
        if: matrix.needs_qt
        run: echo "QMAKE=$(which qmake)" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release ${{ matrix.cargo_flags }}

      # gui & hybrid
      - name: Package AppImage (gui/hybrid)
        if: matrix.needs_qt
        run: |
          curl -fsSL -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o linuxdeploy-plugin-qt \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt

          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp target/release/kanae AppDir/usr/bin/

          cat > AppDir/usr/share/applications/kanae.desktop <<'EOF'
          [Desktop Entry]
          Name=Kanae
          Exec=kanae
          Icon=kanae
          Type=Application
          Categories=AudioVideo;Player;
          EOF

          python3 - <<'PYEOF'
          import struct, zlib
          def make_png(w, h, r, g, b):
              def chunk(tag, data):
                  c = tag + data
                  return struct.pack('>I', len(data)) + c + struct.pack('>I', zlib.crc32(c) & 0xFFFFFFFF)
              raw = (b'\x00' + bytes([r, g, b, 255]) * w) * h
              return (b'\x89PNG\r\n\x1a\n'
                  + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
                  + chunk(b'IDAT', zlib.compress(raw))
                  + chunk(b'IEND', b''))
          with open('AppDir/usr/share/icons/hicolor/256x256/apps/kanae.png', 'wb') as f:
              f.write(make_png(256, 256, 30, 30, 60))
          PYEOF

          export QML_SOURCES_PATHS="$PWD/qml"
          export EXTRA_QT_MODULES="qml;quick;quickcontrols2;quicktemplates2;quicklayouts;quickshapes;network"
          export QMAKE_EXECUTABLE="$QMAKE"
          ./linuxdeploy \
            --appdir AppDir \
            --plugin qt \
            --output appimage

          mv Kanae*.AppImage "kanae-${{ matrix.variant }}-linux-x86_64-${VERSION}.AppImage"

      # tui only
      - name: Package executable (tui)
        if: matrix.variant == 'tui'
        run: cp target/release/kanae "kanae-tui-linux-x86_64-${VERSION}"

      - uses: actions/upload-artifact@v4
        with:
          name: kanae-linux-${{ matrix.variant }}
          if-no-files-found: error
          path: |
            kanae-${{ matrix.variant }}-linux-x86_64-${{ env.VERSION }}.AppImage
            kanae-tui-linux-x86_64-${{ env.VERSION }}

  # final release job
  release:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # manual runs publish a rolling "dev" prerelease; tag pushes cut a real one
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/kanae-gui-windows-x64-${{ env.VERSION }}.exe
            artifacts/kanae-hybrid-windows-x64-${{ env.VERSION }}.exe
            artifacts/kanae-tui-windows-x64-${{ env.VERSION }}.exe
            artifacts/kanae-gui-macos-*-${{ env.VERSION }}.zip
            artifacts/kanae-hybrid-macos-*-${{ env.VERSION }}.zip
            artifacts/kanae-tui-macos-*-${{ env.VERSION }}
            artifacts/kanae-gui-linux-x86_64-${{ env.VERSION }}.AppImage
            artifacts/kanae-hybrid-linux-x86_64-${{ env.VERSION }}.AppImage
            artifacts/kanae-tui-linux-x86_64-${{ env.VERSION }}
